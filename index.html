<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPIX Pro Control Panel</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .dashboard { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .header h1 { font-size: 18px; font-weight: 600; color: var(--accent); }
        .badge { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 5px 10px; border-radius: 20px; background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge.active { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        
        .grid-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn { padding: 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; color: white; background: #1e293b; border: 1px solid var(--border-color); text-align: center; }
        .btn:hover { background: #334155; }
        .btn-start { background: var(--success); border: none; }
        .btn-stop { background: var(--danger); border: none; }
        .btn-full { grid-column: span 2; background: #0284c7; border: none; }

        .section-title { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
        .terminal { background: #030712; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; height: 220px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 12px; color: #38bdf8; display: flex; flex-direction: column; gap: 6px; }
        .footer { margin-top: 15px; text-align: center; font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>MiniPIX Web Control Panel</h1>
            <div id="status-badge" class="badge">
                <span class="dot"></span> <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="grid-controls">
            <button class="btn btn-start" onclick="triggerAction('start')">🚀 Start Auto-Play</button>
            <button class="btn btn-stop" onclick="triggerAction('stop')">🛑 Stop Engine</button>
            <button class="btn btn-full" onclick="promptLogin()">📱 Login / Add Account via Phone</button>
        </div>

        <div>
            <div class="section-title">Live Execution & Worker Activity Logs</div>
            <div id="terminal-logs" class="terminal">
                <div>[System] Web Dashboard initialized successfully.</div>
            </div>
        </div>

        <div class="footer">
            Pure Web Automation Panel & Go Backend
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(`${wsProtocol}${window.location.host}/ws`);

        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const terminal = document.getElementById('terminal-logs');

        ws.onopen = () => {
            statusBadge.className = 'badge active';
            statusText.textContent = 'Live & Connected';
            appendLog('System', 'Connected to Render backend stream.');
        };

        ws.onclose = () => {
            statusBadge.className = 'badge';
            statusText.textContent = 'Disconnected';
            appendLog('System', 'WebSocket connection lost.');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                appendLog(`Worker #${data.worker}`, data.status);
            } catch (e) {
                appendLog('Data', event.data);
            }
        };

        function triggerAction(action) {
            fetch(`/api/${action}`, { method: 'POST' })
                .then(res => res.json())
                .then(data => appendLog('API', data.message || 'Action executed'))
                .catch(err => appendLog('Error', 'Request failed'));
        }

        function promptLogin() {
            const phone = prompt("Enter your 10-digit mobile number (+91):");
            if (phone) {
                appendLog('Auth', `Requesting OTP for +91${phone}...`);
                // Aap yahan backend API call add kar sakte hain jo OTP generate karegi
            }
        }

        function appendLog(source, message) {
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.innerHTML = `<span style="color: #475569;">[${time}]</span> <b style="color: #f472b6;">[${source}]</b> ${message}`;
            terminal.appendChild(logLine);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
