<!-- File Name: index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniPIX Pro Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --border-color: #1e293b;
            --accent: #38bdf8;
            --success: #22c55e;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .dashboard { width: 100%; max-width: 650px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .header h1 { font-size: 22px; font-weight: 600; color: var(--accent); }
        .badge { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 20px; background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge.active { background: rgba(34, 197, 94, 0.1); color: var(--success); }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .controls { display: flex; gap: 15px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        .btn-start { background: var(--success); color: white; }
        .btn-start:hover { opacity: 0.9; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-stop:hover { opacity: 0.9; }
        .section-title { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .terminal { background: #04060c; border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; height: 280px; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 13px; color: #38bdf8; display: flex; flex-direction: column; gap: 8px; }
        .footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>MiniPIX Pro Automation</h1>
            <div id="status-badge" class="badge">
                <span class="dot"></span> <span id="status-text">Disconnected</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-start" onclick="startAutomation()">🚀 Start Automation</button>
            <button class="btn btn-stop" onclick="stopAutomation()">🛑 Stop Automation</button>
        </div>

        <div>
            <div class="section-title">Live Engine & AI Worker Logs</div>
            <div id="terminal-logs" class="terminal">
                <div>[System] Dashboard loaded successfully. Connecting to backend...</div>
            </div>
        </div>

        <div class="footer">
            High-Performance Go Engine & DeepSeek AI Integration
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const ws = new WebSocket(`${wsProtocol}${window.location.host}/ws`);

        const statusBadge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        const terminal = document.getElementById('terminal-logs');

        ws.onopen = () => {
            statusBadge.className = 'badge active';
            statusText.textContent = 'Live & Connected';
            appendLog('System', 'Connected to Render backend stream.');
        };

        ws.onclose = () => {
            statusBadge.className = 'badge';
            statusText.textContent = 'Disconnected';
            appendLog('System', 'WebSocket connection lost.');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                appendLog(`Worker #${data.worker}`, data.status);
            } catch (e) {
                appendLog('Data', event.data);
            }
        };

        function startAutomation() {
            fetch('/api/start', { method: 'POST' })
                .then(res => res.json())
                .then(data => appendLog('API', data.message))
                .catch(err => appendLog('Error', 'Failed to start automation'));
        }

        function stopAutomation() {
            fetch('/api/stop', { method: 'POST' })
                .then(res => res.json())
                .then(data => appendLog('API', data.message))
                .catch(err => appendLog('Error', 'Failed to stop automation'));
        }

        function appendLog(source, message) {
            const time = new Date().toLocaleTimeString();
            const logLine = document.createElement('div');
            logLine.innerHTML = `<span style="color: #475569;">[${time}]</span> <b style="color: #f472b6;">[${source}]</b> ${message}`;
            terminal.appendChild(logLine);
            terminal.scrollTop = terminal.scrollHeight;
        }
    </script>
</body>
</html>
